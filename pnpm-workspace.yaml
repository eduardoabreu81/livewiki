packages:
  - "packages/*"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  tree-sitter-cli: true
  tree-sitter-javascript: true
  tree-sitter-python: true
  tree-sitter-typescript: true

# Fase 0: apenas `core` e `cli`. `packages/mcp` entra na Fase 4 (especificação
# de MCP server) — não antecipar. Decisão alinhada com SPEC.md:
# "se simplificar, começar single-package e extrair depois é aceitável".
