name: cross-platform-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.os }} / node-${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - "20"
        include:
          - os: ubuntu-latest
            node: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Run all tests
        run: pnpm -r test

      - name: CLI entry-point smoke (default shell)
        # Default shell on Windows is PowerShell, on Ubuntu/macOS is Bash.
        # This step intentionally runs once per matrix leg using the
        # runner's default shell.
        run: pnpm exec livewiki --help

      - name: "CLI entry-point smoke (Windows: cmd)"
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: pnpm exec livewiki --help

      - name: "CLI entry-point smoke (macOS: zsh)"
        if: matrix.os == 'macos-latest'
        shell: zsh {0}
        run: pnpm exec livewiki --help
