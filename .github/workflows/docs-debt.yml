# Dogfood instance of packages/cli/templates/github-actions/docs-debt.yml.
# Same mechanics, but builds the CLI from the checkout because
# @livewiki/cli is not published to npm yet. Runs in report mode (never
# fails) for the first window; flip LIVEWIKI_DEBT_MODE to enforce once
# the signal is trusted. Detection is deterministic — zero LLM tokens.

name: livewiki docs debt (dogfood)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LIVEWIKI_DEBT_MODE: report

jobs:
  docs-debt:
    name: docs-debt (zero tokens)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and build (pre-publish dogfood)
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build

      - name: livewiki index (deterministic — no LLM)
        run: node packages/cli/dist/index.js index --quiet

      - name: docs-debt report and gate
        shell: bash
        env:
          STATUS_JSON: ${{ runner.temp }}/livewiki-status.json
        run: |
          set -euo pipefail
          node packages/cli/dist/index.js status --json > "$STATUS_JSON"
          node -e '
            const fs = require("node:fs");
            const s = JSON.parse(fs.readFileSync(process.env.STATUS_JSON, "utf8"));
            const debt = s.debt ?? { total: 0, byEvent: {}, items: [] };
            const lines = [];
            lines.push("## livewiki docs debt");
            lines.push("");
            if (debt.total === 0) {
              lines.push("**No documentation debt — zero tokens spent.**");
            } else {
              lines.push(`**${debt.total} open debt item(s)** — changed: ${debt.byEvent.changed ?? 0}, ` +
                `moved: ${debt.byEvent.moved ?? 0}, deleted: ${debt.byEvent.deleted ?? 0}.`);
              lines.push("");
              lines.push("| risk | event | assignee | anchor |");
              lines.push("|---:|---|---|---|");
              for (const it of (debt.items ?? []).slice(0, 10)) {
                const risk = it.risk && typeof it.risk.score === "number" ? it.risk.score : "—";
                lines.push(`| ${risk} | ${it.event} | ${it.assignee} | \`${it.symbol_key ?? it.wiki_path ?? "?"}\` |`);
              }
              lines.push("");
              lines.push("Pay the debt with `livewiki update` (in-session) or `livewiki update --llm`, " +
                "then `livewiki verify`. Detection above cost zero tokens.");
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
            if (debt.total > 0 && process.env.LIVEWIKI_DEBT_MODE !== "report") {
              console.error(`docs debt: ${debt.total} open item(s) — failing (mode=enforce)`);
              process.exit(1);
            }
          '
