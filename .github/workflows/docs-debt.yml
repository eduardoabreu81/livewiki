# Dogfood instance of packages/cli/templates/github-actions/docs-debt.yml.
# It builds the CLI from the checkout and reports four independent signals:
# baseline availability, detected debt, verify issues, and undocumented symbols.
# This stays in report mode until the dogfood wiki commits its first baseline.
# Indexing and verification are deterministic and spend zero LLM tokens.

name: livewiki docs debt (dogfood)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LIVEWIKI_DEBT_MODE: report

jobs:
  docs-debt:
    name: docs-debt (zero tokens)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and build dogfood checkout
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build

      - name: livewiki index (deterministic — no LLM)
        run: node packages/cli/dist/index.js index --quiet

      - name: docs-debt report and gate
        shell: bash
        env:
          STATUS_JSON: ${{ runner.temp }}/livewiki-status.json
          VERIFY_JSON: ${{ runner.temp }}/livewiki-verify.json
        run: |
          set -euo pipefail
          node packages/cli/dist/index.js status --json > "$STATUS_JSON"
          node packages/cli/dist/index.js verify --json > "$VERIFY_JSON" || true
          node -e '
            const fs = require("node:fs");
            const s = JSON.parse(fs.readFileSync(process.env.STATUS_JSON, "utf8"));
            const v = JSON.parse(fs.readFileSync(process.env.VERIFY_JSON, "utf8"));
            const debt = s.debt ?? { total: 0, byEvent: {}, items: [] };
            const baseline = debt.baseline ?? "unavailable";
            const repository = debt.repository ?? null;
            const issues = Array.isArray(v.issues) ? v.issues : [];
            const undocumented = s.undocumented ?? { total: 0, sample: [] };
            const undocumentedByRole = undocumented.byRole ?? {};
            const productUndocumented = undocumentedByRole.product ?? { total: 0, sample: [] };
            const cell = (value) => String(value ?? "").replace(/\|/g, "\\|").replace(/\r?\n/g, " ");
            const lines = [];
            lines.push("## livewiki documentation health");
            lines.push("");
            lines.push("### Baseline");
            lines.push("");
            if (baseline === "available") {
              lines.push("**Available.** Health is computed from the repository-versioned documentation baseline.");
            } else {
              lines.push(`**${baseline}.** Repository-portable documentation health cannot be established.`);
            }
            lines.push("");
            lines.push("### Documentation debt");
            lines.push("");
            if (baseline !== "available" || repository === null) {
              lines.push("**Not measurable.** Create or repair the versioned baseline before enforcing documentation health.");
            } else {
              lines.push(`**${repository.total ?? 0} open item(s).** Changed: ${repository.byEvent?.changed ?? 0}, ` +
                `moved: ${repository.byEvent?.moved ?? 0}, deleted: ${repository.byEvent?.deleted ?? 0}.`);
              lines.push("");
              lines.push(`Unbaselined: ${repository.unbaselined?.total ?? 0}; inferred: ${repository.inferred?.total ?? 0}; removed anchors: ${repository.removedAnchors?.total ?? 0}.`);
            }
            const visibleDebtItems = repository?.items ?? [];
            if (visibleDebtItems.length > 0) {
              lines.push("");
              lines.push("| risk | event | assignee | page | anchor |");
              lines.push("|---:|---|---|---|---|");
              for (const it of visibleDebtItems.slice(0, 10)) {
                const risk = it.risk && typeof it.risk.score === "number" ? it.risk.score : "—";
                lines.push(`| ${risk} | ${cell(it.event)} | ${cell(it.assignee)} | \`${cell(it.wiki_path ?? "—")}\` | \`${cell(it.symbol_key ?? "?")}\` |`);
              }
            }
            lines.push("");
            lines.push("### Verify issues");
            lines.push("");
            lines.push(`**${issues.length} issue(s)** across ${v.pagesChecked ?? 0} page(s).`);
            if (issues.length > 0) {
              lines.push("");
              lines.push("| severity | code | page | detail |");
              lines.push("|---|---|---|---|");
              for (const issue of issues.slice(0, 10)) {
                lines.push(`| ${cell(issue.severity)} | ${cell(issue.code)} | \`${cell(issue.wikiPath)}\` | ${cell(issue.detail)} |`);
              }
            }
            lines.push("");
            lines.push("### Undocumented product symbols");
            lines.push("");
            lines.push(`**${productUndocumented.total ?? 0} product symbol(s) without documentation.**`);
            for (const role of ["test", "fixture", "tooling", "docs"]) {
              const count = undocumentedByRole[role]?.total ?? 0;
              if (count > 0) {
                lines.push("");
                lines.push(`${count} ${role} symbol(s) are tracked separately and are not documentation work.`);
              }
            }
            if ((productUndocumented.sample ?? []).length > 0) {
              lines.push("");
              for (const item of productUndocumented.sample.slice(0, 10)) {
                lines.push(`- \`${cell(item.symbol_key)}\``);
              }
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
            const failures = [];
            if (baseline !== "available" || repository === null) failures.push(`documentation baseline ${baseline}`);
            if ((repository?.total ?? 0) > 0) failures.push(`${repository.total} repository debt item(s)`);
            if ((repository?.unbaselined?.total ?? 0) > 0) failures.push(`${repository.unbaselined.total} unbaselined anchor(s)`);
            if ((repository?.inferred?.total ?? 0) > 0) failures.push(`${repository.inferred.total} inferred baseline entries`);
            if ((repository?.removedAnchors?.total ?? 0) > 0) failures.push(`${repository.removedAnchors.total} removed anchor(s)`);
            if (issues.length > 0) failures.push(`${issues.length} verify issue(s)`);
            if (failures.length > 0 && process.env.LIVEWIKI_DEBT_MODE !== "report") {
              console.error(`livewiki documentation gate: ${failures.join("; ")} — failing (mode=enforce)`);
              process.exit(1);
            }
          '
