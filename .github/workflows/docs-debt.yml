# Dogfood instance of packages/cli/templates/github-actions/docs-debt.yml.
# It builds the CLI from the checkout and reports four independent signals:
# baseline availability, detected debt, verify issues, and undocumented symbols.
# Fresh CI checkouts have no content-debt baseline, so this runs in report mode.
# Indexing and verification are deterministic and spend zero LLM tokens.

name: livewiki docs debt (dogfood)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LIVEWIKI_DEBT_MODE: report

jobs:
  docs-debt:
    name: docs-debt (zero tokens)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and build dogfood checkout
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build

      - name: livewiki index (deterministic — no LLM)
        run: node packages/cli/dist/index.js index --quiet

      - name: docs-debt report and gate
        shell: bash
        env:
          STATUS_JSON: ${{ runner.temp }}/livewiki-status.json
          VERIFY_JSON: ${{ runner.temp }}/livewiki-verify.json
        run: |
          set -euo pipefail
          node packages/cli/dist/index.js status --json > "$STATUS_JSON"
          node packages/cli/dist/index.js verify --json > "$VERIFY_JSON" || true
          node -e '
            const fs = require("node:fs");
            const s = JSON.parse(fs.readFileSync(process.env.STATUS_JSON, "utf8"));
            const v = JSON.parse(fs.readFileSync(process.env.VERIFY_JSON, "utf8"));
            const debt = s.debt ?? { total: 0, byEvent: {}, items: [] };
            const baseline = debt.baseline ?? "unavailable";
            const issues = Array.isArray(v.issues) ? v.issues : [];
            const undocumented = s.undocumented ?? { total: 0, sample: [] };
            const cell = (value) => String(value ?? "").replace(/\|/g, "\\|").replace(/\r?\n/g, " ");
            const lines = [];
            lines.push("## livewiki documentation health");
            lines.push("");
            lines.push("### Baseline");
            lines.push("");
            if (baseline === "available") {
              lines.push("**Available.** Content-debt comparisons use prior ledger state from this checkout.");
            } else {
              lines.push("**Unavailable.** Content debt cannot be measured in this checkout: the index is new and has no previous ledger state.");
            }
            lines.push("");
            lines.push("### Documentation debt");
            lines.push("");
            if (baseline === "unavailable") {
              lines.push("**Not measurable in this checkout.** `changed` debt cannot be detected without a baseline; only `deleted` is reliable here.");
              lines.push("");
              lines.push(`Detected anyway: ${debt.byEvent?.deleted ?? 0} deleted item(s).`);
            } else {
              lines.push(`**${debt.total ?? 0} open item(s).** Changed: ${debt.byEvent?.changed ?? 0}, ` +
                `moved: ${debt.byEvent?.moved ?? 0}, deleted: ${debt.byEvent?.deleted ?? 0}.`);
            }
            const visibleDebtItems = baseline === "unavailable"
              ? (debt.items ?? []).filter((item) => item.event === "deleted")
              : (debt.items ?? []);
            if (visibleDebtItems.length > 0) {
              lines.push("");
              lines.push("| risk | event | assignee | page | anchor |");
              lines.push("|---:|---|---|---|---|");
              for (const it of visibleDebtItems.slice(0, 10)) {
                const risk = it.risk && typeof it.risk.score === "number" ? it.risk.score : "—";
                lines.push(`| ${risk} | ${cell(it.event)} | ${cell(it.assignee)} | \`${cell(it.wiki_path ?? "—")}\` | \`${cell(it.symbol_key ?? "?")}\` |`);
              }
            }
            lines.push("");
            lines.push("### Verify issues");
            lines.push("");
            lines.push(`**${issues.length} issue(s)** across ${v.pagesChecked ?? 0} page(s).`);
            if (issues.length > 0) {
              lines.push("");
              lines.push("| severity | code | page | detail |");
              lines.push("|---|---|---|---|");
              for (const issue of issues.slice(0, 10)) {
                lines.push(`| ${cell(issue.severity)} | ${cell(issue.code)} | \`${cell(issue.wikiPath)}\` | ${cell(issue.detail)} |`);
              }
            }
            lines.push("");
            lines.push("### Undocumented symbols");
            lines.push("");
            lines.push(`**${undocumented.total ?? 0} undocumented symbol(s).**`);
            if ((undocumented.sample ?? []).length > 0) {
              lines.push("");
              for (const item of undocumented.sample.slice(0, 10)) {
                lines.push(`- \`${cell(item.symbol_key)}\``);
              }
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
            const failures = [];
            if (baseline === "unavailable") failures.push("content-debt baseline unavailable");
            if (issues.length > 0) failures.push(`${issues.length} verify issue(s)`);
            if (failures.length > 0 && process.env.LIVEWIKI_DEBT_MODE !== "report") {
              console.error(`livewiki documentation gate: ${failures.join("; ")} — failing (mode=enforce)`);
              process.exit(1);
            }
          '
